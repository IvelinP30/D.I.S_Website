name: Football sync

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: football-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Wake Render and synchronize football
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start protected synchronization
        env:
          FOOTBALL_SYNC_SECRET: ${{ secrets.FOOTBALL_SYNC_SECRET }}
        run: |
          if [ -z "$FOOTBALL_SYNC_SECRET" ]; then
            echo "::error::Add FOOTBALL_SYNC_SECRET in the repository Actions secrets."
            exit 1
          fi

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $FOOTBALL_SYNC_SECRET" \
            --header "Content-Type: application/json" \
            https://dis-podcast.onrender.com/api/internal/football-sync
