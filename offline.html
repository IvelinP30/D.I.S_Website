<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050608" />
    <title>Няма връзка | D.I.S Подкаст</title>
    <link rel="icon" type="image/png" href="/assets/pwa/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 50% 20%, rgba(56, 242, 127, 0.13), transparent 34rem),
          #050608;
        color: #f7f8fb;
        padding: 24px;
      }

      main {
        width: min(480px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(16, 22, 32, 0.82);
        padding: clamp(28px, 7vw, 48px);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }

      h1 { margin: 22px 0 12px; font-size: clamp(2rem, 8vw, 3rem); }
      p { margin: 0; color: #aab2c0; line-height: 1.65; }

      button {
        margin-top: 26px;
        border: 0;
        border-radius: 999px;
        background: #38f27f;
        color: #051008;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/pwa/icon-192.png" alt="" />
      <h1>Няма интернет връзка</h1>
      <p>Свържи се с интернет и опитай отново, за да видиш актуалното съдържание на D.I.S Подкаст.</p>
      <button type="button" onclick="window.location.reload()">Опитай отново</button>
    </main>
  </body>
</html>
