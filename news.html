<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Новини, обновления и съобщения от D.I.S Подкаст."
    />
    <title>D.I.S Подкаст - Новини</title>
    <link rel="icon" type="image/png" href="./assets/dis-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/#hero" aria-label="D.I.S Подкаст начало">
          <span class="brand-mark">
            <img id="header-logo" src="./assets/dis-logo.png" alt="" />
          </span>
          <span id="header-brand-name">D.I.S Подкаст</span>
        </a>
        <nav class="nav" id="main-nav" aria-label="Основна навигация"></nav>
      </header>

      <main>
        <section class="subpage-hero" id="news" data-section-hero="news">
          <img class="subpage-hero-image" id="news-hero-image" src="./assets/news-football-hero.webp" alt="hero background image" />
          <div class="subpage-hero-overlay"></div>
          <div class="subpage-hero-copy">
            <p class="section-kicker" id="news-kicker">Новини</p>
            <h1 id="news-title">Последни новини и обновления от <span class="brand-name">D.I.S Подкаст</span>.</h1>
            <p id="news-description">Ръчно добавени публикации от екипа: съобщения, теми, реакции, важни моменти и нови идеи около канала.</p>
          </div>
        </section>
        <section class="ad-marquee-section news-ad-marquee" aria-label="Активни реклами">
          <div class="ad-marquee-header"><span>Активни партньори</span></div>
          <div class="ad-marquee" data-active-ad-marquee></div>
        </section>
        <section class="section news-listing">
          <div class="news-grid" id="news-grid"></div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <div class="footer-brand">
            <span class="brand-mark">
              <img class="footer-logo" src="./assets/dis-logo.png" alt="" />
            </span>
            <div>
              <strong class="footer-brand-name">D.I.S Подкаст</strong>
              <p>Футболни реакции, подкасти, live моменти и кратки видеа.</p>
            </div>
          </div>
          <nav class="footer-nav" data-footer-nav aria-label="Footer навигация"></nav>
          <div class="footer-actions">
            <a class="footer-email" data-footer-email href="mailto:hello@dispodcast.bg"></a>
            <div class="footer-socials" data-footer-socials></div>
          </div>
        </div>
      </footer>
    </div>

    <aside class="football-scroll-progress" aria-hidden="true">
      <span class="scroll-ball"></span>
    </aside>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
