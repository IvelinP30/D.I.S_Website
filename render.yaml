services:
  - type: web
    name: dis-podcast
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: dis-media
      - key: RESEND_API_KEY
        sync: false
      - key: MESSAGE_EMAIL_FROM
        sync: false
      - key: FOOTBALL_SYNC_SECRET
        generateValue: true
      - key: NEWSDATA_API_KEY
        sync: false
      - key: NEWSDATA_QUERY
        value: футбол
      - key: NEWSDATA_BULGARIAN_QUERY
        value: Левски OR ЦСКА OR Лудогорец OR efbet лига OR национален отбор
      - key: NEWSDATA_LANGUAGE
        value: bg
      - key: NEWSDATA_MAX_ITEMS
        value: 20
      - key: GA_MEASUREMENT_ID
        value: G-G21K94TW2T
